services:
  shouldipanic:
    image: ghcr.io/akaihigurashi/shouldipanic:latest
    # build: .
    container_name: shouldipanic
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"      # nginx on the host does TLS and forwards to it
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
