# nginx on the host: TLS for the landing page and every scanner, forwarding to the
# containers from deploy/docker-compose.yml. Replace example.ch with your domain.
# One certificate for example.ch and *.example.ch, e.g. with certbot and a DNS plugin:
#   certbot certonly --dns-<provider> -d example.ch -d '*.example.ch'
#
# Copy to /etc/nginx/conf.d/shouldipanic.conf (or sites-available + a symlink), then
#   nginx -t && systemctl reload nginx

limit_req_zone $binary_remote_addr zone=panic_api:10m rate=6r/m;    # checks per visitor
limit_req_zone $binary_remote_addr zone=panic_page:10m rate=60r/m;  # page loads per visitor

server {
    listen 80;
    listen [::]:80;
    server_name example.ch *.example.ch;
    return 301 https://$host$request_uri;
}

# landing page
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.ch;
    ssl_certificate     /etc/letsencrypt/live/example.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ch/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # access keys: /unlock, its API and the badge script come from the php2scan container
    location ~ ^/(unlock|unlock\.css|unlock\.js|trust\.js|api/whoami)$ {
        limit_req zone=panic_page burst=20 nodelay;
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ~ ^/api/(unlock|lock)$ {
        limit_req zone=panic_api burst=3 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        limit_req zone=panic_page burst=20 nodelay;
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
    }
}

# www -> bare domain
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.example.ch;
    ssl_certificate     /etc/letsencrypt/live/example.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ch/privkey.pem;
    return 301 https://example.ch$request_uri;
}

# scanners: the subdomain picks the container
map $host $panic_backend {
    php2scan.example.ch     http://127.0.0.1:8088;
    brotli2scan.example.ch  http://127.0.0.1:8089;
    plex2scan.example.ch    http://127.0.0.1:8091;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name php2scan.example.ch brotli2scan.example.ch plex2scan.example.ch;
    ssl_certificate     /etc/letsencrypt/live/example.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ch/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 4k;

    location ~ ^/api/(scan|unlock|lock)$ {
        limit_req zone=panic_api burst=3 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        proxy_pass $panic_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location / {
        limit_req zone=panic_page burst=20 nodelay;
        limit_except GET HEAD { deny all; }
        proxy_pass $panic_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
